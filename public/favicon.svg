<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#206bc4" />
      <stop offset="100%" stop-color="#4299e1" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd43b" />
      <stop offset="100%" stop-color="#fab005" />
    </linearGradient>
  </defs>

  <!-- Background Hex/Node Circle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0f172a" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#aiGrad)" stroke-width="2.5" />

  <!-- Agentic Head / Core Node -->
  <circle cx="32" cy="27" r="11" fill="none" stroke="url(#aiGrad)" stroke-width="3" />
  
  <!-- Neural / Agentic Connectors -->
  <line x1="21" y1="27" x2="10" y2="27" stroke="#4299e1" stroke-width="2.5" stroke-linecap="round" />
  <line x1="43" y1="27" x2="54" y2="27" stroke="#4299e1" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="16" x2="32" y2="8" stroke="#4299e1" stroke-width="2.5" stroke-linecap="round" />
  <line x1="32" y1="38" x2="32" y2="44" stroke="#4299e1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Sub Agent Nodes -->
  <circle cx="10" cy="27" r="3.5" fill="#206bc4" />
  <circle cx="54" cy="27" r="3.5" fill="#206bc4" />
  <circle cx="32" cy="8" r="3.5" fill="#206bc4" />
  <circle cx="19" cy="48" r="3" fill="#38bdf8" />
  <circle cx="45" cy="48" r="3" fill="#38bdf8" />
  
  <line x1="32" y1="44" x2="19" y2="48" stroke="#38bdf8" stroke-width="2" />
  <line x1="32" y1="44" x2="45" y2="48" stroke="#38bdf8" stroke-width="2" />

  <!-- Center AI Core Pulse (Sparkle/Star) -->
  <path d="M32 21 C32 25 30 27 26 27 C30 27 32 29 32 33 C32 29 34 27 38 27 C34 27 32 25 32 21 Z" fill="url(#sparkleGrad)" />

  <!-- Agent Sparks -->
  <circle cx="47" cy="14" r="2" fill="#ffd43b" />
</svg>
